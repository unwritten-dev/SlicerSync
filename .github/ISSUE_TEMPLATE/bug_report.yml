name: Bug report / Fehler melden
description: Something does not work as expected. / Etwas funktioniert nicht wie erwartet.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or German is fine. / Danke für die Meldung! Deutsch oder Englisch ist beides ok.
        **Security problems:** please use *Security → Report a vulnerability* instead. / **Sicherheitsprobleme** bitte über *Security → Report a vulnerability* melden.
  - type: input
    id: version
    attributes:
      label: SlicerSync version / Version
      description: Windows Settings → Apps → SlicerSync. / Windows-Einstellungen → Apps → SlicerSync.
      placeholder: "1.0.6"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Installer (SlicerSync-Setup)
        - Portable EXE
    validations:
      required: true
  - type: input
    id: slicers
    attributes:
      label: Slicers and versions / Slicer und Versionen
      placeholder: "Orca Slicer 2.3.1, PrusaSlicer 2.9.2"
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what happened instead? / Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log / Protokoll
      description: |
        Tray menu → *Open log* (`%LocalAppData%\SlicerSync\slicersync.log`). Please paste the relevant part and remove anything private (user names, repository URLs).
        Tray-Menü → *Protokoll öffnen*. Bitte den passenden Ausschnitt einfügen und Privates entfernen (Benutzernamen, Repository-URLs).
      render: text
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
