name: Release

# Push a tag like v1.2.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item publish/SlicerSync.exe "dist/SlicerSync-$version-portable.exe"
          # Release notes: only the section "## <version>" of CHANGELOG.md
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\s*$\s*(.*?)(?=^## |\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          Set-Content notes.md $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.exe).FullName --title "SlicerSync $version" --notes-file notes.md
